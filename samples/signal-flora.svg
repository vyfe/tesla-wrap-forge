<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600">
  <defs>
    <linearGradient id="leaf" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#2f6b58"/>
      <stop offset="1" stop-color="#0e2d24"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f1df"/>
      <stop offset="1" stop-color="#e4d9bf"/>
    </linearGradient>
    <pattern id="grain" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="3" r="1" fill="#173f35" opacity="0.1"/>
      <circle cx="13" cy="9" r="1.2" fill="#173f35" opacity="0.08"/>
      <circle cx="7" cy="16" r="0.8" fill="#173f35" opacity="0.12"/>
    </pattern>
    <clipPath id="frame"><rect width="1600" height="1600"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1600" height="1600" fill="#f2eee2"/>
    <rect width="1600" height="1600" fill="url(#grain)"/>

    <!-- green field -->
    <path d="M0 0H1600V520C1260 430 1010 490 790 640C540 810 330 830 0 770Z" fill="url(#leaf)"/>
    <path d="M0 770C330 830 540 810 790 640C1010 490 1260 430 1600 520" fill="none" stroke="#f2eee2" stroke-width="8"/>

    <!-- coral sun -->
    <circle cx="1160" cy="960" r="380" fill="#f25b3d"/>
    <circle cx="1160" cy="960" r="380" fill="none" stroke="#173f35" stroke-width="3"/>
    <g fill="none" stroke="#f7f1df" stroke-width="2" opacity="0.7">
      <circle cx="1160" cy="960" r="310"/>
      <circle cx="1160" cy="960" r="250"/>
      <path d="M780 960H1540M1160 580V1340"/>
      <path d="M892 692L1428 1228M1428 692L892 1228" opacity="0.45"/>
    </g>

    <!-- giant leaves -->
    <g fill="url(#cream)" stroke="#173f35" stroke-width="3">
      <path d="M120 1460C120 980 380 660 790 560C760 960 520 1280 120 1460Z"/>
      <path d="M132 1452C420 1180 570 920 748 606" fill="none" stroke="#173f35" stroke-width="5"/>
      <path d="M300 1260C380 1170 470 1120 560 1100M210 1340C310 1270 400 1230 500 1210M400 1120C470 1040 550 990 630 960" fill="none" stroke="#173f35" stroke-width="3" opacity="0.8"/>
    </g>
    <g fill="#173f35">
      <path d="M980 1460C980 1130 1160 920 1460 850C1430 1180 1260 1390 980 1460Z"/>
      <path d="M1010 1440C1170 1220 1280 1060 1440 870" fill="none" stroke="#f2eee2" stroke-width="4" opacity="0.55"/>
    </g>

    <!-- cobalt signal path -->
    <path d="M-40 1050C260 980 390 1040 540 1180C690 1320 840 1370 1080 1310" fill="none" stroke="#1f3bff" stroke-width="32"/>
    <path d="M-40 1050C260 980 390 1040 540 1180C690 1320 840 1370 1080 1310" fill="none" stroke="#f2eee2" stroke-width="3" stroke-dasharray="8 14"/>

    <!-- technical type block -->
    <g fill="#173f35">
      <text x="86" y="150" font-family="Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="12">SIGNAL FLORA</text>
      <text x="88" y="186" font-family="Menlo, monospace" font-size="15" letter-spacing="5" opacity="0.6">BOTANICAL STUDY / 02</text>
      <text x="1512" y="150" text-anchor="end" font-family="Menlo, monospace" font-size="15" letter-spacing="4" opacity="0.6">WF–MY–014</text>
    </g>
    <g fill="#f2eee2">
      <text x="86" y="500" font-family="Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="9">FIELD NOTES</text>
      <text x="88" y="536" font-family="Menlo, monospace" font-size="14" letter-spacing="4" opacity="0.7">LEAF / LIGHT / SIGNAL</text>
    </g>

    <!-- registration marks -->
    <g stroke="#173f35" stroke-width="2" opacity="0.55">
      <path d="M86 1460H210M86 1460V1336M86 1460L130 1416"/>
      <path d="M1512 1460H1388M1512 1460V1336M1512 1460L1468 1416"/>
    </g>
    <g fill="#173f35">
      <rect x="1300" y="1450" width="70" height="4"/>
      <rect x="1300" y="1462" width="44" height="4"/>
      <rect x="1300" y="1474" width="58" height="4"/>
    </g>
  </g>
</svg>
